[package]
name = "wreq-ruby"
description = "Ruby bindings for Wreq, HTTP client library in Rust."
authors = ["SearchApi <support@searchapi.io>"]
homepage = "https://github.com/SearchApi/wreq-ruby"
repository = "https://github.com/SearchApi/wreq-ruby"
edition = "2024"
version = "1.3.2"
rust-version = "1.100"

[lib]
crate-type = ["cdylib"]
doc = false
name = "wreq_ruby"

[dependencies]
magnus = { version = "0.9.0", features = ["bytes"] }
rb-sys = { version = "0.9.128", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
# Keep the existing trust store independent of wreq's default feature selection.
wreq = { version = "0.16.1", default-features = false, features = [
    "tokio-rt",
    "http2",
    "chromium-roots",
    "query",
    "form",
    "json",
    "socks",
    "stream",
    "cookies",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
wreq-util = { version = "3.0.0-rc", features = ["emulation-compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0.151", features = [
    "arbitrary_precision",
    "preserve_order",
] }
serde_path_to_error = "0.1.20"
indexmap = { version = "2.14.0", features = ["serde"] }
cookie = "0.18.1"
bytes = "1.12.1"
arc-swap = "1.9.1"
http = "1.4.1"
http-body-util = "0.1.4"
futures-util = { version = "0.3.33", default-features = false }

[target.'cfg(unix)'.dependencies]
forkguard = { version = "0.1.3", features = ["atfork"] }

[dev-dependencies]
magnus = { version = "0.9.0", features = ["embed"] }

[build-dependencies]
rb-sys-env = "0.2.2"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
strip = true

[patch.crates-io]
# Match the Git patches used by wreq main; Cargo.lock pins the exact revisions.
btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
btls-sys = { git = "https://github.com/0x676e67/btls", branch = "main" }
tokio-btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
http2 = { git = "https://github.com/0x676e67/http2", branch = "master" }
netty = { git = "https://github.com/0x676e67/netty", branch = "main" }
wreq = { git = "https://github.com/0x676e67/wreq", branch = "main" }
wreq-util = { path = "crates/wreq-util" }
