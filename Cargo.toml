[package]
name = "wreq-ruby"
description = "Ruby bindings for Wreq, HTTP client library in Rust."
authors = ["SearchApi <support@searchapi.io>"]
homepage = "https://github.com/SearchApi/wreq-ruby"
repository = "https://github.com/SearchApi/wreq-ruby"
edition = "2024"
rust-version = "1.85"
version = "1.1.0"

[lib]
crate-type = ["cdylib"]
doc = false
name = "wreq_ruby"

[dependencies]
magnus = { version = "0.8.2", features = ["bytes", "rb-sys"] }
rb-sys = { version = "0.9.128", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
wreq = { git = "https://github.com/0x676e67/wreq", features = [
    "query",
    "form",
    "json",
    "socks",
    "stream",
    "cookies",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "system-proxy",
] }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", features = ["emulation-compression"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_magnus = "0.11.0"
indexmap = { version = "2.14.0", features = ["serde"] }
cookie = "0.18.1"
bytes = "1.11.1"
arc-swap = "1.9.1"
http = "1.4.0"
http-body-util = "0.1.3"
futures-util = { version = "0.3.32", default-features = false }

[build-dependencies]
rb-sys-env = "0.2.2"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
strip = true
