[package]
name = "wreq-ruby"
description = "Ruby bindings for Wreq, HTTP client library in Rust."
authors = ["SearchApi <support@searchapi.io>"]
homepage = "https://github.com/SearchApi/wreq-ruby"
repository = "https://github.com/SearchApi/wreq-ruby"
edition = "2024"
rust-version = "1.97"
version = "1.2.4"

[lib]
crate-type = ["cdylib"]
doc = false
name = "wreq_ruby"

[dependencies]
magnus = { version = "0.8.2", features = ["bytes"] }
rb-sys = { version = "0.9.128", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
wreq = { version = "6.0.0-rc", features = [
    "query",
    "form",
    "json",
    "socks",
    "stream",
    "cookies",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "system-proxy",
] }
wreq-util = { version = "3.0.0-rc", features = ["emulation-compression"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0.150", features = [
    "arbitrary_precision",
    "preserve_order",
] }
serde_path_to_error = "0.1.20"
indexmap = { version = "2.14.0", features = ["serde"] }
cookie = "0.18.1"
bytes = "1.12.1"
arc-swap = "1.9.1"
http = "1.4.1"
http-body-util = "0.1.3"
futures-util = { version = "0.3.32", default-features = false }

[target.'cfg(unix)'.dependencies]
forkguard = { version = "0.1.3", features = ["atfork"] }

[dev-dependencies]
magnus = { version = "0.8.2", features = ["embed"] }

[build-dependencies]
rb-sys-env = "0.2.2"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
strip = true
