[package]
name = "serde_magnus"
version = "0.11.0"
description = "Serde integration for Magnus"
edition = "2024"
rust-version = "1.98"
publish = false
authors = [
    "Joe Wilm <joe@jwilm.com>",
    "George Claghorn <georgeclaghorn@gmail.com>",
]
repository = "https://github.com/OneSignal/serde-magnus"
documentation = "https://docs.rs/serde_magnus"
license = "MIT"
readme = "README.md"
keywords = ["serde", "magnus", "ruby"]
categories = ["development-tools::ffi"]

[dependencies]
serde = "1.0"
magnus = { version = "0.9.0", features = ["bytes"] }
indexmap = "2.14.0"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
magnus = { version = "0.9.0", features = ["embed"] }
